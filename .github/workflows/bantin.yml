name: Ban tin hang ngay

on:
  schedule:
    # GitHub Actions KHONG bao dam chay dung gio, ke ca voi repo public.
    # Khi he thong qua tai, job bi tri hang gio hoac bi huy luon.
    # Vi vay dat 2 lich, dung phut le de tranh dinh tai o cac moc :00 va :30.
    #
    #   Lich chinh    : 22:47 UTC = 05:47 gio VN ngay hom sau
    #   Lich du phong : 01:15 UTC = 08:15 gio VN cung ngay
    #
    # File last_run.txt dam bao chi gui 1 lan/ngay du ca 2 lich deu chay.
    - cron: '47 22 * * 0-4'      # CN-T5 UTC  ->  T2-T6 gio VN
    - cron: '15 1 * * 1-5'       # T2-T6 UTC  ->  T2-T6 gio VN
  workflow_dispatch:
    inputs:
      force:
        description: 'Gui lai du hom nay da gui roi'
        type: boolean
        default: false

concurrency:
  group: bantin
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cai thu vien
        run: pip install -r requirements.txt

      - name: Chay ban tin
        env:
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_RUN:         ${{ inputs.force }}
        run: python main.py

      # Buoc ghi so nay KHONG duoc lam job that bai:
      # ban tin da gui roi, mot xung dot git khong dang bao dong do.
      - name: Ghi dau ngay da gui
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_run.txt 2>/dev/null || true
          git add last_update_id.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Khong co thay doi, bo qua commit"
            exit 0
          fi
          git commit -m "Ban tin $(cat last_run.txt 2>/dev/null || date -u +%F)"
          # Repository co the vua duoc workflow khac push vao -> thu lai vai lan
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Da luu last_run.txt"
              exit 0
            fi
            echo "Push bi tu choi, dong bo lai roi thu lai (lan $i)"
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "CANH BAO: khong push duoc sau 5 lan."
          echo "Ban tin VAN da gui thanh cong. Rui ro: lich du phong co the gui trung."
          exit 0
