name: Nghe lenh Telegram

# Job nay dinh ky hoi Telegram xem co lenh moi khong.
# Go /run trong Telegram -> lan do ke tiep se chay ban tin.
#
# Repository dang PUBLIC nen phut Actions mien phi khong gioi han,
# vi vay do 10 phut/lan, 24/7, ca cuoi tuan.
# Neu sau nay doi lai sang Private (2.000 phut/thang), phai thu hep
# lich lai, vi du: '*/15 0-9 * * 1-5' (chi gio hanh chinh, T2-T6).
#
# Do tre thuc te: 0-10 phut cho cho lan do, cong do tre cua cron GitHub.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: bantin                     # dung chung nhom voi workflow ban tin
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cai thu vien
        run: pip install -r requirements.txt

      - name: Do lenh Telegram
        env:
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_command.py

      - name: Luu trang thai
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last_update_id.txt 2>/dev/null || true
          git add last_run.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Khong co thay doi"
            exit 0
          fi
          git commit -m "Cap nhat trang thai bot"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Da luu trang thai"
              exit 0
            fi
            echo "Push bi tu choi, dong bo lai roi thu lai (lan $i)"
            git pull --rebase --autostash origin main || true
            sleep 3
          done
          echo "CANH BAO: khong luu duoc trang thai sau 5 lan."
          exit 0
