name: Nghe lenh Telegram

# Job nay dinh ky hoi Telegram xem co lenh moi khong.
# Go /run trong Telegram -> lan do ke tiep se chay ban tin.
#
# LUU Y VE CHI PHI: moi lan chay tinh toi thieu 1 phut Actions.
# Repository private co 2.000 phut mien phi/thang.
# Lich hien tai: 15 phut/lan, tu 05:00 den 17:00 gio VN, T2-T6
#   = 48 lan/ngay x 22 ngay ~ 1.056 phut/thang. Con du cho job ban tin.
#
# Neu muon do lien tuc 24/7 ma khong lo phut: doi repository sang Public
# (Settings > General > Danger Zone > Change visibility).
# Secrets van duoc giau kin khi repo public.

on:
  schedule:
    - cron: '*/15 22-23 * * 0-4'    # 05:00-06:59 gio VN
    - cron: '*/15 0-9 * * 1-5'      # 07:00-16:59 gio VN
  workflow_dispatch:

concurrency:
  group: bantin                     # dung chung nhom voi workflow ban tin
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cai thu vien
        run: pip install -r requirements.txt

      - name: Do lenh Telegram
        env:
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN:    ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:  ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_command.py

      - name: Luu trang thai
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A last_update_id.txt last_run.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Khong co thay doi"
          else
            git commit -m "Cap nhat trang thai bot"
            git pull --rebase --autostash origin main || true
            git push
            echo "Da luu trang thai"
          fi
